name: payday
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  go_router: ^13.2.0
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4  # Add this line

# Configure the launcher icons at the root level (no indentation)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpg"   # Points directly to your file

flutter:
  uses-material-design: true
  assets:
    - assets/images/                  # Make sure this line is closed with a hyphen/dash